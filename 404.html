<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | VroomVroom</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#b3202b">
<link rel="icon" type="image/png" sizes="128x128" href="/favicon.png?v=2">
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=New+Rocker&display=swap" rel="stylesheet">
<style>
  :root {
    --red:   #b3202b;
    --char:  #2c2426;
    --cream: #f6ede8;
    --gold:  #e4b962;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--char); }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 40px 24px;
    font-family: "Baloo 2", system-ui, sans-serif;
    font-weight: 700;
    color: var(--cream);
    text-align: center;
    overflow-x: hidden;
  }

  /* same blurred checkerboard + red -> charcoal fade as the main page */
  .bg {
    position: fixed;
    inset: -40px;
    z-index: -3;
    filter: blur(7px);
    background:
      conic-gradient(rgba(0,0,0,0.22) 25%, transparent 0 50%, rgba(0,0,0,0.22) 0 75%, transparent 0)
        0 0 / 90px 90px,
      linear-gradient(90deg,
        var(--red) 0%, var(--red) 18%, #a5202a 26%, #85212a 36%, #612228 44%,
        #4a2427 52%, #3a2426 60%, #302426 68%, var(--char) 78%, var(--char) 100%);
  }
  .vignette {
    position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.45) 100%);
  }
  .frame {
    position: fixed; inset: 12px; z-index: 10; pointer-events: none;
    border: 5px solid var(--cream);
    border-radius: 14px;
    box-shadow: 0 0 0 2px rgba(0,0,0,0.5), inset 0 0 0 2px rgba(0,0,0,0.35), 0 0 30px rgba(0,0,0,0.4);
    animation: fade 0.7s ease-out both;
  }

  main { max-width: 560px; }

  .logo {
    display: block;
    width: 130px; height: 130px;
    margin: 0 auto 1.4rem;
    image-rendering: pixelated;
    background: #000;
    border: 4px solid var(--cream);
    border-radius: 10px;
    box-shadow: 0 0 0 3px rgba(0,0,0,0.5), 0 0 34px rgba(255,59,74,0.45), 0 12px 30px rgba(0,0,0,0.5);
    animation: pop 0.8s cubic-bezier(.2,.8,.3,1) 0.2s both;
  }

  h1 {
    font-family: "New Rocker", serif;
    font-weight: 400;
    font-size: clamp(5rem, 16vw, 9rem);
    line-height: 1;
    color: var(--gold);
    text-shadow: 0 4px 18px rgba(0,0,0,0.5);
  }
  h1::after {
    content: "";
    display: block;
    width: 64px; height: 4px;
    margin: 14px auto 1.6rem;
    border-radius: 4px;
    background: var(--gold);
    box-shadow: 0 0 12px rgba(228,185,98,0.55);
  }
  h2 { font-size: clamp(1.7rem, 4vw, 2.3rem); line-height: 1.1; margin-bottom: 0.6rem; }
  p  { font-size: clamp(1.1rem, 2.6vw, 1.35rem); font-weight: 500; line-height: 1.3; color: rgba(246,237,232,0.85); }

  .btn {
    position: relative;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    margin-top: 1.8rem;
    padding: 0.8rem 1.8rem;
    border: 2px solid rgba(246,237,232,0.6);
    border-radius: 999px;
    background: linear-gradient(180deg, #f2d189, #d19c3c);
    color: #2b1c0a;
    font-size: 1.2rem;
    font-weight: 800;
    text-decoration: none;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    transition: transform 0.25s cubic-bezier(.2,.8,.3,1), box-shadow 0.25s;
  }
  .btn::before {
    content: "";
    position: absolute;
    top: 0; left: -75%;
    width: 45%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.6), transparent);
    transform: skewX(-20deg);
    transition: left 0.65s ease;
  }
  .btn:hover, .btn:focus-visible {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 12px 26px rgba(0,0,0,0.45), 0 0 26px rgba(228,185,98,0.6);
  }
  .btn:hover::before, .btn:focus-visible::before { left: 130%; }
  .btn:active { transform: translateY(0) scale(0.98); }
  .btn:focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }

  .reveal { animation: rise 0.8s cubic-bezier(.2,.7,.3,1) var(--d, 0s) both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop  { from { opacity: 0; scale: 0.85; } to { opacity: 1; scale: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .frame, .logo, .reveal { animation: none; }
    .btn, .btn::before { transition: none; }
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="vignette"></div>
  <div class="frame"></div>

  <main>
    <img class="logo" src="/Logo.png" alt="VroomVroom logo">
    <h1 class="reveal" style="--d:.4s">404</h1>
    <h2 class="reveal" style="--d:.6s">Page not found</h2>
    <p class="reveal" style="--d:.75s">This level doesn't exist. Head back to the homepage and try again.</p>
    <a class="btn reveal" style="--d:.9s" href="/">Back to VroomVroom</a>
  </main>
</body>
</html>
