<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VroomVroom</title>
<link rel="icon" type="image/png" href="Logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=New+Rocker&display=swap" rel="stylesheet">
<style>
  :root {
    --red:        #b3202b;   /* left side, pulled from the logo */
    --char:       #2c2426;   /* right side, warm charcoal */
    --cream:      #f6ede8;   /* text + border */
    --logo-red:   #ff3b4a;   /* left accent */
    --gold:       #e4b962;   /* right accent: antique gold suits the gothic title and sits well on red + charcoal */
    --check-size: 90px;
  }
 
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--char); }
 
  body {
    position: relative;
    min-height: 100vh;
    font-family: "Baloo 2", system-ui, sans-serif;
    font-weight: 700;
    color: var(--cream);
    overflow-x: hidden;
  }
 
  /* ---------- Background ---------- */
  .bg {
    position: fixed;
    inset: -40px;
    z-index: -4;
    filter: blur(7px);
    background:
      conic-gradient(rgba(0,0,0,0.22) 25%, transparent 0 50%, rgba(0,0,0,0.22) 0 75%, transparent 0)
        0 0 / var(--check-size) var(--check-size),
      linear-gradient(90deg,
        var(--red) 0%, var(--red) 18%, #a5202a 26%, #85212a 36%, #612228 44%,
        #4a2427 52%, #3a2426 60%, #302426 68%, var(--char) 78%, var(--char) 100%);
  }
 
  .blend {
    position: fixed;
    top: 0; bottom: 0; left: 25%; width: 50%;
    z-index: -3;
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 50%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 50%, transparent);
    pointer-events: none;
  }
 
  .vignette {
    position: fixed;
    inset: 0;
    z-index: -2;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.45) 100%);
    pointer-events: none;
  }
 
  /* ---------- Divider + border ---------- */
  .divider {
    position: fixed;
    top: 17px; bottom: 17px; left: 50%;
    width: 5px;
    translate: -50% 0;
    transform-origin: top;
    background: var(--cream);
    box-shadow: -2px 0 0 rgba(0,0,0,0.5), 2px 0 0 rgba(0,0,0,0.5);
    z-index: 11;
    pointer-events: none;
    animation: draw 0.9s cubic-bezier(.65,0,.25,1) 0.15s both;
  }
 
  .frame {
    position: fixed;
    inset: 12px;
    border: 5px solid var(--cream);
    border-radius: 14px;
    box-shadow: 0 0 0 2px rgba(0,0,0,0.5), inset 0 0 0 2px rgba(0,0,0,0.35), 0 0 30px rgba(0,0,0,0.4);
    z-index: 10;
    pointer-events: none;
    animation: fade 0.7s ease-out both;
  }
 
  /* ---------- Layout ---------- */
  .page {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 100vh;
    padding: 24px;
  }
 
  .logo {
    position: absolute;
    top: 44px;
    left: 50%;
    translate: -50% 0;
    width: 200px; height: 200px;
    image-rendering: pixelated;
    background: #000;
    border: 4px solid var(--cream);
    border-radius: 10px;
    box-shadow: 0 0 0 3px rgba(0,0,0,0.5), 0 0 34px rgba(255,59,74,0.45), 0 12px 30px rgba(0,0,0,0.5);
    z-index: 12;            /* sits above the divider line */
    animation: pop 0.8s cubic-bezier(.2,.8,.3,1) 0.55s both;
  }
 
  .side  { padding: 36px 5vw; }
  .left  { padding-right: 140px; }
  .right { padding-left: 140px; }
 
  h1 { line-height: 1.1; text-align: center; text-shadow: 0 2px 12px rgba(0,0,0,0.4); }
  h1::after {
    content: "";
    display: block;
    width: 64px; height: 4px;
    margin: 14px auto 2.4rem;
    border-radius: 4px;
    background: var(--logo-red);
    box-shadow: 0 0 12px rgba(255,59,74,0.6);
  }
  .left h1  { font-size: clamp(2rem, 3.4vw, 3rem); font-weight: 800; }
  .right h1 {
    font-family: "New Rocker", serif;
    font-weight: 400;
    font-size: clamp(2.4rem, 4vw, 3.6rem);
    color: var(--gold);
  }
  .right h1::after { background: var(--gold); box-shadow: 0 0 12px rgba(228,185,98,0.55); }
 
  .panel {
    margin-bottom: 1.6rem;
    padding: 1.3rem 1.6rem 1.5rem;
    background: rgba(0,0,0,0.22);
    border: 2px solid rgba(246,237,232,0.16);
    border-radius: 18px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  h2 { font-size: clamp(1.5rem, 2.4vw, 2rem); line-height: 1.1; margin-bottom: 0.6rem; }
  p  { font-size: clamp(1.1rem, 1.7vw, 1.35rem); line-height: 1.3; font-weight: 500; color: rgba(246,237,232,0.85); }
 
  /* ---------- Load-in animation (one sequence: line, logo, titles, panels) ---------- */
  .reveal { animation: rise 0.8s cubic-bezier(.2,.7,.3,1) var(--d, 0s) both; }
 
  @keyframes draw { from { scale: 1 0; } to { scale: 1 1; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop  { from { opacity: 0; scale: 0.85; } to { opacity: 1; scale: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
 
  @media (prefers-reduced-motion: reduce) {
    .divider, .frame, .logo, .reveal { animation: none; }
  }
 
  /* ---------- Mobile ---------- */
  @media (max-width: 800px) {
    .bg {
      background:
        conic-gradient(rgba(0,0,0,0.22) 25%, transparent 0 50%, rgba(0,0,0,0.22) 0 75%, transparent 0)
          0 0 / 60px 60px,
        linear-gradient(180deg,
          var(--red) 0%, var(--red) 20%, #85212a 36%, #4a2427 52%,
          #302426 66%, var(--char) 78%, var(--char) 100%);
    }
    .blend {
      left: 0; right: 0; width: auto; top: 25%; bottom: 25%;
      -webkit-mask-image: linear-gradient(180deg, transparent, #000 50%, transparent);
              mask-image: linear-gradient(180deg, transparent, #000 50%, transparent);
    }
    .divider { display: none; }
    .page { grid-template-columns: 1fr; }
    .logo { position: static; translate: none; display: block; margin: 16px auto 0; width: 130px; height: 130px; }
    .side, .left, .right { padding: 24px 5vw; }
    .right { border-top: 2px solid rgba(246,237,232,0.3); margin-top: 8px; }
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="blend"></div>
  <div class="vignette"></div>
  <div class="divider"></div>
  <div class="frame"></div>
 
  <main class="page">
    <img class="logo" src="Logo.png" alt="VroomVroom logo">
 
    <div class="side left">
      <h1 class="reveal" style="--d:.8s">VroomVroom</h1>
 
      <div class="panel reveal" style="--d:1s">
        <h2>Channel Statistics</h2>
        <p>Subscriber count, total views, and channel growth will be shown here.</p>
      </div>
 
      <div class="panel reveal" style="--d:1.15s">
        <h2>Video Progress</h2>
        <p>Follow what's currently in production and which videos are releasing next.</p>
      </div>
    </div>
 
    <div class="side right">
      <h1 class="reveal" style="--d:.9s">Cilkocrate</h1>
 
      <div class="panel reveal" style="--d:1.1s">
        <h2>Latest Updates</h2>
        <p>Projects, announcements, and news from Cilkocrate will be posted here.</p>
      </div>
    </div>
  </main>
</body>
</html>
